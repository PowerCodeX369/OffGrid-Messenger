name: Repository and host checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check repository metadata
        run: python3 scripts/repository_check.py
      - name: Unit tests for repository checks
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
  browser-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser protocol contract
        run: node firmware/tests/test-protocol.cjs
